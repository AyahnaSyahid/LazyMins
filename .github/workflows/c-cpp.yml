# C/C++ Windows Desktop CI

name: C/C++ CI

on:
  push:
    branches:
      - qt6-main
  pull_request:
    branches:
      - qt6-main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python and aqtinstall
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: python -m pip install --upgrade pip aqtinstall

      - name: Install Qt 6.8.3 for MinGW
        run: |
          python -m aqt install-qt windows desktop 6.8.3 win64_mingw --outputdir C:\Qt

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure CMake
        run: |
          $qtDir = 'C:\Qt\6.8.3\win64_mingw'
          $env:PATH = "$qtDir\bin;" + $env:PATH
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$qtDir"

      - name: Build
        run: cmake --build build --config Release

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy build artifacts
        run: |
          New-Item -ItemType Directory -Path build/artifacts -Force | Out-Null
          Copy-Item -Path build\**\* -Destination build/artifacts -Recurse -Force

