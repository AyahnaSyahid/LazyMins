name: C/C++ Windows Desktop CI

on:
  push:
    branches: [qt6-main]
  pull_request:
    branches: [qt6-main]

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_VERSION: 6.8.3
      QT_PATH: ${{ github.workspace }}\Qt # Gunakan workspace agar relatif
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_PATH }}
          key: qt-${{ env.QT_VERSION }}-mingw-${{ runner.os }}

      - name: Install Qt & Toolchain
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_mingw --outputdir ${{ env.QT_PATH }}
          python -m aqt install-tool windows desktop tools_ninja qt.tools.ninja --outputdir ${{ env.QT_PATH }}
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir ${{ env.QT_PATH }}

      - name: Setup Environment Paths
        shell: pwsh
        run: |
          $qt_root = "${{ env.QT_PATH }}\${{ env.QT_VERSION }}\win64_mingw"
          echo "CMAKE_PREFIX_PATH=$qt_root" >> $env:GITHUB_ENV
          # Menambahkan binary ke PATH agar CMake bisa menemukan compiler dan Qt tools
          echo "${{ env.QT_PATH }}\Tools\CMake_64\bin" >> $env:GITHUB_PATH
          echo "${{ env.QT_PATH }}\Tools\Ninja" >> $env:GITHUB_PATH
          echo "${{ env.QT_PATH }}\Tools\mingw1310_64\bin" >> $env:GITHUB_PATH
          echo "$qt_root\bin" >> $env:GITHUB_PATH

      - name: Configure CMake
        shell: pwsh
        run: |
          # Pastikan path ini benar-benar sesuai dengan lokasi instalasi aqt
          $qt_path = "C:\Qt\6.8.3\win64_mingw"
          
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qt_path" `
            -DQt6_DIR="$qt_path/lib/cmake/Qt6" # Opsional, tapi membantu jika prefix gagal

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/ # Sesuaikan dengan lokasi .exe hasil build