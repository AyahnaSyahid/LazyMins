# C/C++ Windows Desktop CI

name: C/C++ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Qt 6 for MinGW
        uses: qt-actions/setup-qt@v2
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: x64
          toolchain: mingw

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy build artifacts
        run: |
          New-Item -ItemType Directory -Path build/artifacts -Force | Out-Null
          Copy-Item -Path build\**\* -Destination build/artifacts -Recurse -Force

