# C/C++ Windows Desktop CI

name: C/C++ CI

on:
  push:
    branches:
      - qt6-main
  pull_request:
    branches:
      - qt6-main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python and aqtinstall
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake
        uses: lukka/get-cmake@v4
        with:
          cmake-version: '3.27.10'

      - name: Install aqtinstall
        run: python -m pip install --upgrade pip aqtinstall

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:\Qt\6.8.3\win64_mingw
          key: qt-6.8.3-win64-mingw-${{ runner.os }}

      - name: Install Qt 6.8.3 for MinGW
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m aqt install-qt windows desktop 6.8.3 win64_mingw --outputdir C:\Qt

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure CMake
        env:
          CMAKE_PREFIX_PATH: C:\Qt\6.8.3\win64_mingw
          PATH: C:\Qt\6.8.3\win64_mingw\bin;${{ env.PATH }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        env:
          CMAKE_PREFIX_PATH: C:\Qt\6.8.3\win64_mingw
          PATH: C:\Qt\6.8.3\win64_mingw\bin;${{ env.PATH }}
        run: cmake --build build

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy build artifacts
        run: |
          New-Item -ItemType Directory -Path build/artifacts -Force | Out-Null
          Copy-Item -Path build\**\* -Destination build/artifacts -Recurse -Force

