name: C/C++ Windows Desktop CI

on:
  push:
    branches: [qt6-main]
  pull_request:
    branches: [qt6-main]

jobs:
  build:
    runs-on: windows-latest
    
    env:
      QT_VERSION: 6.8.3
      # Menggunakan C:\ untuk menghindari masalah spasi atau path panjang di workspace
      QT_INSTALL_DIR: C:\Qt

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_INSTALL_DIR }}
          key: qt-${{ env.QT_VERSION }}-mingw1310-v2 # v2 untuk force refresh jika sebelumnya zonk

      - name: Install Qt & Toolchain
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          # Install Qt & Tools ke C:\Qt
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_mingw --outputdir ${{ env.QT_INSTALL_DIR }}
          python -m aqt install-tool windows desktop tools_ninja qt.tools.ninja --outputdir ${{ env.QT_INSTALL_DIR }}
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir ${{ env.QT_INSTALL_DIR }}

      - name: Dynamic Environment Setup
        shell: pwsh
        run: |
          # Cari di mana lokasi folder bin Qt berada (karena aqt bisa pakai 'mingw_64' atau 'win64_mingw')
          $qt_bin = Get-ChildItem -Path "${{ env.QT_INSTALL_DIR }}\${{ env.QT_VERSION }}\*" -Include bin -Recurse | Select-Object -ExpandProperty FullName -First 1
          $qt_root = Split-Path -Parent $qt_bin
          $ninja_bin = Get-ChildItem -Path "${{ env.QT_INSTALL_DIR }}\Tools\*" -Include ninja.exe -Recurse | Select-Object -ExpandProperty FullName -First 1 | Split-Path -Parent
          $mingw_bin = Get-ChildItem -Path "${{ env.QT_INSTALL_DIR }}\Tools\*" -Include g++.exe -Recurse | Select-Object -ExpandProperty FullName -First 1 | Split-Path -Parent

          Write-Host "Found Qt Root: $qt_root"
          Write-Host "Found MinGW: $mingw_bin"

          # Daftarkan ke PATH
          echo "$qt_bin" >> $env:GITHUB_PATH
          echo "$ninja_bin" >> $env:GITHUB_PATH
          echo "$mingw_bin" >> $env:GITHUB_PATH

          # Daftarkan ke ENV untuk CMake
          $prefix = $qt_root.Replace('\', '/')
          echo "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV
          
          # Kirim Qt6_DIR spesifik jika find_package masih gagal
          $qt6_cmake = "$qt_root\lib\cmake\Qt6".Replace('\', '/')
          echo "Qt6_DIR=$qt6_cmake" >> $env:GITHUB_ENV

      - name: Verify Qt6 Config
        shell: pwsh
        run: |
          if (Test-Path "${{ env.Qt6_DIR }}\Qt6Config.cmake") {
            Write-Host "✅ Confirmed: Qt6Config.cmake exists at ${{ env.Qt6_DIR }}"
          } else {
            Write-Error "❌ Still not found! Listing directory for debug:"
            Get-ChildItem -Path ${{ env.QT_INSTALL_DIR }} -Recurse -Filter "Qt6Config.cmake"
            exit 1
          }

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release